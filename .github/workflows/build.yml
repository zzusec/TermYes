name: Build

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test grid layout
        run: |
          swiftc Sources/GridLayout.swift Tests/main.swift -o /tmp/termosaic-grid-tests
          /tmp/termosaic-grid-tests
      - name: Test semantic versions
        run: |
          swiftc Sources/SemanticVersion.swift Tests/VersionTests.swift -o /tmp/termosaic-version-tests
          /tmp/termosaic-version-tests
          swiftc Sources/SemanticVersion.swift Sources/GitHubReleaseLocation.swift Tests/ReleaseLocationTests.swift -o /tmp/termosaic-release-location-tests
          /tmp/termosaic-release-location-tests
          swiftc Sources/GitHubCLI.swift Tests/GitHubCLITests.swift -o /tmp/termyes-private-release-tests
          /tmp/termyes-private-release-tests
          swiftc Sources/SemanticVersion.swift Sources/GitHubReleaseLocation.swift Sources/GitHubCLI.swift Sources/UpdateController.swift Tests/UpdateToolTests.swift -o /tmp/termyes-update-tool-tests
          /tmp/termyes-update-tool-tests
      - name: Test verified Agent readiness
        run: |
          swiftc Sources/AgentGuardController.swift Tests/AgentGuardReadinessTests.swift -o /tmp/termyes-readiness-tests
          /tmp/termyes-readiness-tests
          swiftc Sources/LaunchAtLoginController.swift Tests/LoginItemTests.swift -o /tmp/termyes-login-tests
          /tmp/termyes-login-tests
          swiftc Sources/AgentAutoUpdateController.swift Tests/AgentUpdateReportTests.swift -o /tmp/termyes-report-tests
          /tmp/termyes-report-tests
      - name: Test compact menu presentation
        run: |
          swiftc Sources/MenuPresentation.swift Tests/MenuPresentationTests.swift -o /tmp/termyes-menu-presentation-tests
          /tmp/termyes-menu-presentation-tests
      - name: Test Agent guards and scheduled continue
        run: |
          PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -B Tests/test_agent_guard.py
          PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -B Tests/test_permission_modes.py
          PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -B Tests/test_policy_update.py
          PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -B Tests/test_strict_policy.py
          PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -B Tests/test_shell_syntax.py
          PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -B Tests/test_quiet_hours.py
          PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -B Tests/test_agent_updates.py
          PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -B Tests/test_guard_pause.py
          PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -B Tests/test_menu_copy.py
          PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -B Tests/test_continue_task.py
          PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -B Tests/test_codex_token_guard.py
          PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -B Tests/test_regression_runner.py
          bash AgentGuard/test.sh
          PYTHONDONTWRITEBYTECODE=1 bash AgentGuard/test-codex.sh
          node Tests/test_guard_plugins.mjs
          swiftc Sources/ContinueSchedule.swift Tests/ContinueScheduleTests.swift -o /tmp/termosaic-continue-tests
          /tmp/termosaic-continue-tests
          swiftc Sources/{GridLayout,ContinueSchedule,TerminalManager,GlobalHotKeyController,ScheduledContinueController}.swift Tests/menu_continue_regression.swift -o /tmp/termyes-menu-continue
          /tmp/termyes-menu-continue
      - name: Build universal app
        run: SKIP_INSTALL=1 ./build.sh
      - name: Verify architectures
        run: lipo -archs "build/TermYes.app/Contents/MacOS/TermYes"
      - name: Test update installer
        run: Tests/test_update_installer.sh
      - name: Build and verify DMG
        run: ./create-dmg.sh
      - name: Verify release images and legacy upgrade compatibility
        run: /usr/bin/python3 -B Tests/test_release.py
      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)"
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
          awk '/^# TermYes v/ { if (seen++) exit } { print }' RELEASE_NOTES.md > build/release-notes.md
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag --draft \
            --title "TermYes ${GITHUB_REF_NAME}" \
            --notes-file build/release-notes.md \
            "dist/TermYes-v${VERSION}-macOS.dmg" \
            "dist/TermYes-v${VERSION}-macOS.dmg.sha256" \
            "dist/Termosaic-v${VERSION}-macOS.dmg" \
            "dist/Termosaic-v${VERSION}-macOS.dmg.sha256"
          gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
